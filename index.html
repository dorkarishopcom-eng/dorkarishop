
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorkarishop - Online Shopping</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }
    header {
      background: #087a45;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .search {
      padding: 15px;
      background: white;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .hero {
      background: #e1f5e9;
      margin: 15px;
      padding: 30px 15px;
      border-radius: 12px;
      text-align: center;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 15px;
    }
    .product {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
    .product button {
      background: #087a45;
      color: white;
      border: 0;
      padding: 10px;
      border-radius: 6px;
    }
    footer {
      background: #222;
      color: white;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Dorkarishop</h1>
  <p>আপনার প্রয়োজনীয় সবকিছু এক জায়গায়</p>
</header>

<div class="search">
  <input type="search" placeholder="পণ্য খুঁজুন...">
</div>

<section class="hero">
  <h2>স্বাগতম Dorkarishop-এ!</h2>
  <p>অনলাইনে কেনাকাটা করুন সহজেই।</p>
</section>

<h2 style="text-align:center">আমাদের পণ্য</h2>

<section class="products">
  <div class="product">
    <h3>পণ্য ১</h3>
    <p>৳ ৫০০</p>
    <button>কার্টে যোগ করুন</button>
  </div>
  <div class="product">
    <h3>পণ্য ২</h3>
    <p>৳ ৭০০</p>
    <button>কার্টে যোগ করুন</button>
  </div>
</section>

<footer>
  <p>© 2026 Dorkarishop.com</p>
  <p>Online Shopping Platform in Bangladesh</p>
</footer>

</body>
</html>
